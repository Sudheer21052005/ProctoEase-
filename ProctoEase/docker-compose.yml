
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Judge0 CE — sandboxed code execution ──
  judge0-server:
    image: judge0/judge0:1.13.1
    privileged: true
    restart: unless-stopped
    ports:
      - "2358:2358"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - ./judge0-box:/box
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      # Resource limits per submission
      CPU_TIME_LIMIT: 10
      CPU_EXTRA_TIME: 5
      WALL_TIME_LIMIT: 20
      MEMORY_LIMIT: 131072        # 128 MB
      MAX_PROCESSES_AND_OR_THREADS: 30
      ENABLE_WAIT_RESULT: "true"
      ENABLE_COMPILER_OPTIONS: "true"
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
    depends_on:
      judge0-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2358/languages"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  judge0-worker:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    command: ["./scripts/workers"]
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - ./judge0-box:/box
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
    depends_on:
      judge0-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    privileged: true

  # Separate DB for Judge0 (its own schema, no conflict with ProctoEase)
  judge0-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      POSTGRES_DB: judge0
    volumes:
      - judge0_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U judge0 -d judge0" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0-server:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads

volumes:
  pgdata:
  judge0_pgdata:
